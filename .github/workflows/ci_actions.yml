name: CI (Actions)

on:
  push:
    branches: [main]
    paths:
      - ".github/actions/**"
      - ".github/workflows/ci_actions.yml"
  pull_request:
    branches: [main, release, insiders]
    paths:
      - ".github/actions/**"
      - ".github/workflows/ci_actions.yml"

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and test Actions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .github/actions

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install Actions dependencies
        run: npm ci --include=dev --ignore-scripts --no-fund

      - name: Typecheck Actions
        run: npm run typecheck

      - name: Test Actions
        run: npm test
