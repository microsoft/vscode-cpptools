parameters:
- name: Build_Type
  displayName: Build Type
  type: string
  default: Release

stages:
- stage: Build
  dependsOn: []
  jobs:
  - template: lldb-mi.template.yml
    parameters:
      llvm_build_type: ${{ parameters.Build_Type }}
      llvm_arch: x86_64
  - template: lldb-mi.template.yml
    parameters:
      llvm_build_type: ${{ parameters.Build_Type }}
      llvm_arch: arm64

- stage: Signing
  dependsOn: ["Build"]
  # Production signing is only valid for reviewed code committed to main.
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - template: lldb-mi-sign.template.yml